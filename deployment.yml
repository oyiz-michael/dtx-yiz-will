apiVersion: apps/v1
kind: Deployment
metadata:
  name: dtx-app
  labels:
    app: dtx-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dtx-app
  template:
    metadata:
      labels:
        app: dtx-app
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: dtx-app
        image: dtx-app:v1
        imagePullPolicy: Never
        env:
        - name: APP_VERSION
          value: "v1"
        - name: OTEL_SERVICE_NAME
          value: "dtx-app"
        - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
          value: "http://tempo.monitoring.svc.cluster.local:4318/v1/traces"
        ports:
        - containerPort: 5000
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: dtx-app-service
  labels:
    app: dtx-app
spec:
  ports:
  - port: 80
    targetPort: 5000
    protocol: TCP
    name: http
  selector:
    app: dtx-app

---

