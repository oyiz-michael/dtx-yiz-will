# Expose Grafana externally through the NGF gateway
# Access via: curl -H "Host: grafana.example.com" http://<ELB-HOSTNAME>/
#
# The HTTPRoute lives in monitoring (same namespace as the Grafana service)
# so no ReferenceGrant is needed for the backend reference.

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  parentRefs:
  - name: ngf-gateway
    namespace: nginx-gateway
    sectionName: http
  hostnames:
  - "grafana.example.com"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: kube-prometheus-grafana
      port: 80
