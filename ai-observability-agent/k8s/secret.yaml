# Secret template — values are base64-encoded placeholders.
# DO NOT commit real values. In production, populate via:
#   kubectl create secret generic ai-observability-agent-secrets \
#     --namespace monitoring \
#     --from-literal=GRAFANA_PASSWORD="<password>" \
#     --from-literal=SLACK_WEBHOOK_URL="<url>" \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# NOTE: ANTHROPIC_API_KEY is NOT needed — the agent authenticates to
# Amazon Bedrock via IRSA (IAM Roles for Service Accounts).
apiVersion: v1
kind: Secret
metadata:
  name: ai-observability-agent-secrets
  namespace: monitoring
type: Opaque
stringData:
  GRAFANA_PASSWORD: "REPLACE_ME"
  SLACK_WEBHOOK_URL: ""     # optional — leave empty to disable Slack
  GRAFANA_API_KEY: ""       # optional — if set, used instead of password
  SNS_PHONE_NUMBER: ""      # optional — E.164 format, e.g. +15551234567
  EMAIL_SENDER: "oyiz.ugn@gmail.com"      # SES-verified sender
