# Secret template — DO NOT commit real values.
# Populate via kubectl (see README for full command):
#   kubectl create secret generic ai-observability-agent-secrets \
#     --namespace monitoring \
#     --from-literal=ANTHROPIC_API_KEY="<key>" \
#     --from-literal=GRAFANA_PASSWORD="<password>" \
#     --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: ai-observability-agent-secrets
  namespace: monitoring
type: Opaque
stringData:
  ANTHROPIC_API_KEY: "REPLACE_ME"
  GRAFANA_PASSWORD: "REPLACE_ME"
  SLACK_WEBHOOK_URL: ""     # optional — leave empty to disable Slack
  GRAFANA_API_KEY: ""       # optional — if set, used instead of password
